name: Testar, compilar e publicar

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot e templates Web
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          destino=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $destino
          unzip -qj Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
            templates/web_nothreads_release.zip templates/web_nothreads_debug.zip \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            templates/linux_release.x86_64 templates/linux_debug.x86_64 templates/version.txt -d $destino
          rm -f *.zip *.tpz

      - name: Testes
        run: tools/testar.sh

      - name: Exportar para Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.pck

      - name: Exportar para Windows e Linux
        run: |
          mkdir -p build/windows build/linux
          godot --headless --path . --export-release "Windows" build/windows/ChamadoAberto.exe
          godot --headless --path . --export-release "Linux" build/linux/ChamadoAberto.x86_64
          test -f build/windows/ChamadoAberto.exe && test -f build/linux/ChamadoAberto.x86_64

      - name: Disponibilizar versão Windows
        uses: actions/upload-artifact@v4
        with:
          name: ChamadoAberto-Windows
          path: build/windows/ChamadoAberto.exe

      - name: Disponibilizar versão Linux
        uses: actions/upload-artifact@v4
        with:
          name: ChamadoAberto-Linux
          path: build/linux/ChamadoAberto.x86_64

      - name: Enviar build para o GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
